<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSA Library Management System</title>
  
  <!-- Font Setup (Gotham with clean web fallbacks) -->
  <link rel="stylesheet" href="https://use.typekit.net/placeholder.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Barcode Generator Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="logo-container">
      <img src="logo.png" alt="New Summit Academy Logo" class="nsa-logo">
      <h1>NSA Library</h1>
    </div>
    
    <div class="user-role-selector">
      <label for="roleSelect" style="font-weight: 500; margin-right: 0.5rem;">View Mode:</label>
      <select id="roleSelect">
        <option value="student">Student</option>
        <option value="librarian">Librarian</option>
      </select>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('catalog')">📚 Catalog</button>
    <button class="tab-btn" onclick="switchTab('checkout')">🔄 Check In / Out</button>
    <button class="tab-btn librarian-only" onclick="switchTab('import')">📥 Import Google Sheet</button>
  </nav>

  <!-- Main Content Layout -->
  <main>
    <!-- Tab 1: Catalog -->
    <section id="catalog" class="tab-content active">
      <div style="margin-bottom: 1.5rem;">
        <input type="text" id="searchInput" placeholder="Search by title, author, or barcode..." onkeyup="filterBooks()">
      </div>
      <div id="bookGrid" class="book-grid">
        <!-- Book cards dynamically render here via script.js -->
      </div>
    </section>

    <!-- Tab 2: Check In / Out -->
    <section id="checkout" class="tab-content">
      <div class="book-card" style="max-width: 500px; margin: 0 auto;">
        <h2>Check In / Out Book</h2>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">Scan or type the barcode number below:</p>
        <input type="text" id="barcodeInput" placeholder="Enter Barcode Number..." style="margin-bottom: 1rem;">
        <button class="btn-primary" onclick="handleCheckout()">Process Transaction</button>
      </div>
    </section>

    <!-- Tab 3: Google Sheets Import (Librarian View Only) -->
    <section id="import" class="tab-content">
      <div class="book-card">
        <h2>Import Books from Google Sheets</h2>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">
          Paste your spreadsheet rows below (Title, Author, Barcode/ISBN, Status):
        </p>
        <textarea id="csvData" rows="8" placeholder="The Great Gatsby&#9;F. Scott Fitzgerald&#9;9780743273565&#9;Available" style="margin-bottom: 1rem;"></textarea>
        <button class="btn-primary" onclick="importData()">Import & Sync Books</button>
      </div>
    </section>
  </main>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
